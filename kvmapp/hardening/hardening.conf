# NanoKVM hardened build: network policy defaults.
#
# Copy this file to /etc/kvm/hardening.conf on the device, or put it on the
# SD card's boot partition as /boot/hardening.conf (which wins), to override
# any value. Run "/kvmapp/hardening/harden.sh apply" or reboot to take effect.

# Local networks allowed to reach the web UI and SSH directly over Ethernet.
# Space separated CIDRs. Empty means Tailscale only.
LAN_SUBNETS="192.168.10.0/24"

# TCP ports the LAN subnets (and the tailnet, through tailscale serve) may
# reach: web UI over HTTP and HTTPS, and SSH.
SERVICE_PORTS="80 443 22"

# The only account allowed to open connections to the internet.
TS_USER="tailscale"
TS_UID="4164"

# UDP port tailscaled listens on for direct WireGuard connections.
TS_PORT="41641"

# Resolvers written to /etc/resolv.conf. Only tailscaled may use them: every
# other process on the device is refused DNS by the firewall.
DNS_SERVERS="1.1.1.1 9.9.9.9"

# HTTPS endpoint whose certificate-checked Date header sets the clock. The
# request is made as TS_USER, so it uses Tailscale's firewall exception.
TIMESYNC_URL="https://controlplane.tailscale.com/"
